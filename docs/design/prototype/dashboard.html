<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Trakk prototype</title>
<!-- Design reference only. Not production code. Source of truth for layout, tokens and interactions: docs/DESIGN.md -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0C0D}
a{color:#9FE7C4;text-decoration:none}a:hover{color:#C8F5DF}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
input::placeholder{color:#7F8A91}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid #4ADE9A;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{transition:background .15s}
.row:hover{background:#13181B}
.card{transition:border-color .2s}
.card:hover{border-color:#2E373C}
.chk{transition:border-color .15s,color .15s}
.chk:hover{border-color:#8B969D;color:#E6ECEE}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.bar{transition:height .35s ease,background .35s}
.bar:hover{filter:brightness(1.35)}
.grow{transition:width .45s ease}
.knob{transition:margin-left .2s ease,background .2s}
.scan{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
</style>
<style>.settled .fade{animation:none}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div class="{{scanClass}}" style="min-height: 100vh; box-sizing: border-box; background-color: #0A0C0D; color: #D5DBDE; font-family: 'Inter', system-ui, sans-serif; font-weight: 300; font-size: 12.5px; padding-bottom: 28px">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 0 12px; border-bottom: 1px solid #1A1F22">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1 L17 9 L9 17 L1 9 Z" fill="none" stroke="{{accent}}" stroke-width="1"></path><path d="M9 5.5 L12.5 9 L9 12.5 L5.5 9 Z" fill="{{accent}}"></path></svg>
<span class="mono" style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #E6ECEE">~/trakk</span>
<span class="mono" style="font-size: 10px; color: #7F8A91; border: 1px solid #22282C; border-radius: 3px; padding: 2px 5px">v0.1</span>
</div>
<div class="mono" style="display: flex; align-items: center; gap: 10px; font-size: 11px; color: #8B969D">
<span>{{dateTxt}}</span>
<span style="color: #E6ECEE">{{clock}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px" title="year progress">
<span style="width: 60px; height: 2px; background: #1A1F22; border-radius: 1px; overflow: hidden; display: inline-block"><span style="display: block; width: {{yearPct}}%; height: 100%; background: #3A4348"></span></span>
<span>{{yearPct}}% of year</span>
</span>
</div>
<label style="flex: 1 1 280px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid #1F2529; border-radius: 5px; background: #0E1113">
<span class="mono" style="color: {{accent}}; font-size: 12px">›</span>
<input aria-label="Command: log, search or ask AI" placeholder="log, search or ask AI…" class="mono" style="flex: 1 1 auto; min-width: 0; height: 30px; background: transparent; border: 0; outline: none; font-size: 11.5px; color: #E6ECEE">
<span class="mono" style="font-size: 10px; color: #8B969D; border: 1px solid #2A3135; border-radius: 3px; padding: 1px 5px">⌘K</span>
</label>
<div style="display: flex; align-items: center; gap: 8px; margin-left: auto">
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: #8B969D; padding: 0 6px"><span class="pulse" style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>mcp connected</span>
<button class="chk mono" style="height: 34px; padding: 0 12px; border: 1px solid #2A3135; border-radius: 5px; font-size: 11px; color: #B7C0C4">+ goal</button>
<button class="mono" style="height: 34px; padding: 0 12px; border: 1px solid {{accent}}; border-radius: 5px; font-size: 11px; color: {{accent}}">check-in</button>
</div>
</header>

<section aria-label="Indicators" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
<div class="card" style="background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0">
<div class="mono" style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B969D">{{k.label}}</div>
<div style="display: flex; align-items: baseline; gap: 2px">
<span class="mono" style="font-size: 26px; font-weight: 300; line-height: 1; color: {{k.valueColor}}">{{k.value}}</span>
<span class="mono" style="font-size: 11.5px; color: #7F8A91">{{k.suffix}}</span>
</div>
<div style="height: 2px; background: #1A1F22; border-radius: 1px; overflow: hidden; opacity: {{k.barOpacity}}"><div class="grow" style="width: {{k.barPct}}%; height: 100%; background: {{k.barColor}}"></div></div>
<div class="mono" style="font-size: 10.5px; color: {{k.subColor}}">{{k.sub}}</div>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">

<section aria-labelledby="h-today" style="flex: 1.5 1 440px; min-width: 0; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 10px 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 10px; margin-bottom: 4px; border-bottom: 1px solid #1A1F22">
<h2 id="h-today" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Today <span style="color: #7F8A91; font-weight: 400">· {{doneCount}}/{{actionCount}} actions</span></h2>
<div class="mono" style="display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #8B969D">
<span style="width: 90px; height: 3px; background: #1A1F22; border-radius: 2px; overflow: hidden; display: inline-block"><span class="grow" style="display: block; width: {{todayPct}}%; height: 100%; background: {{accent}}"></span></span>
<span><span style="color: #E6ECEE">{{pts}}</span> / 14 pts</span>
</div>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="8">
<button class="row" aria-pressed="{{a.pressed}}" onClick="{{a.toggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 8px; border-radius: 4px; box-sizing: border-box">
<span style="flex: none; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid {{a.boxBorder}}; background: {{a.boxBg}}; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{a.done}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 L4.2 7.3 L8 2.8" fill="none" stroke="#0A0C0D" stroke-width="1.6"></path></svg></sc-if>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12.5px; color: {{a.titleColor}}; text-decoration: {{a.deco}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.t}}</span>
<span class="mono" style="display: flex; align-items: center; gap: 6px; font-size: 10px; color: #8B969D"><span style="width: 5px; height: 5px; border-radius: 50%; background: {{a.c}}"></span>{{a.g}}<sc-if value="{{a.due}}" hint-placeholder-val="{{ false }}"><span style="color: #F2B03D; letter-spacing: 0.08em">· DUE TODAY</span></sc-if></span>
</span>
<span class="mono" style="flex: none; font-size: 10px; color: #7F8A91; width: 44px; text-align: right">{{a.when}}</span>
<span class="mono" style="flex: none; font-size: 11px; color: {{a.pColor}}; width: 26px; text-align: right">{{a.pTxt}}</span>
</button>
</sc-for>
</div>
</section>

<section aria-labelledby="h-overdue" style="flex: 1 1 300px; min-width: 0; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 10px 10px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 10px; margin-bottom: 4px; border-bottom: 1px solid #1A1F22">
<h2 id="h-overdue" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Overdue <span style="color: #FF6B6B; font-weight: 400">· {{overdueCount}}</span></h2>
<button class="chk mono" style="height: 26px; padding: 0 8px; border: 1px solid #2A3135; border-radius: 4px; font-size: 10px; color: #B7C0C4">replan</button>
</div>
<sc-for list="{{overdue}}" as="o" hint-placeholder-count="4">
<div class="row fade" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; border-radius: 4px">
<span style="flex: none; width: 6px; height: 6px; border-radius: 50%; background: {{o.c}}"></span>
<div style="flex: 1 1 auto; min-width: 0">
<div style="font-size: 12.5px; color: #D5DBDE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.t}}</div>
<div class="mono" style="font-size: 10px; color: #8B969D">{{o.g}} · due {{o.due}}</div>
</div>
<span class="mono" style="flex: none; font-size: 11px; color: #FF6B6B">{{o.late}}</span>
</div>
</sc-for>
<sc-if value="{{showTip}}" hint-placeholder-val="{{ true }}">
<div class="mono" style="margin-top: auto; padding: 10px; border: 1px dashed #2A3135; border-radius: 4px; font-size: 10.5px; line-height: 1.55; color: #B7C0C4"><span style="color: {{accent}}">◆ suggestion</span> · knock out the visa documents on Saturday morning. It unblocks your most behind goal and clears {{lateK}} items from red.</div>
</sc-if>
</section>

<section aria-labelledby="h-next" style="flex: 1 1 300px; min-width: 0; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 14px 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 0 10px; margin-bottom: 10px; border-bottom: 1px solid #1A1F22">
<h2 id="h-next" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Next 7 days</h2>
<span class="mono" style="font-size: 10px; color: #7F8A91">{{upcomingCount}} deadlines</span>
</div>
<sc-for list="{{upcoming}}" as="u" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 50px 10px minmax(0, 1fr); gap: 8px; min-height: 44px">
<div class="mono" style="font-size: 10px; letter-spacing: 0.06em; color: #8B969D; padding-top: 1px">{{u.day}}</div>
<div style="position: relative">
<span style="position: absolute; top: 4px; left: 1px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{u.c}}; background: #0F1214"></span>
<span style="position: absolute; left: 4px; top: 13px; bottom: 0; width: 1px; background: #1F2529"></span>
</div>
<div style="min-width: 0">
<div style="font-size: 12.5px; color: #D5DBDE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.t}}</div>
<div class="mono" style="font-size: 10px; color: #8B969D">{{u.g}}</div>
</div>
</div>
</sc-for>
</section>

</div>

<section aria-labelledby="h-goals" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<h2 id="h-goals" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Goals <span style="color: #7F8A91; font-weight: 400">· {{goalCount}} active · {{onPace}} on pace</span></h2>
<div role="group" aria-label="Filter goals" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="mono" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 28px; padding: 0 10px; border-radius: 4px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.color}}; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase">{{t.label}} <span style="color: #7F8A91">{{t.count}}</span></button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="6">
<article class="card fade" style="position: relative; overflow: hidden; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 13px 14px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 1px; background: {{g.c}}"></div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 7px; height: 7px; border-radius: 2px; background: {{g.c}}"></span>
<span class="mono" style="font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B969D">{{g.type}}</span>
<span class="mono" style="margin-left: auto; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: {{g.priColor}}; border: 1px solid {{g.priBorder}}; border-radius: 3px; padding: 2px 5px">{{g.pri}}</span>
</div>
<h3 style="margin: 0; font-size: 14px; font-weight: 400; line-height: 1.3; color: #E6ECEE">{{g.t}}</h3>
<div class="mono" style="font-size: 10px; color: #8B969D">{{g.start}} → {{g.end}} · {{g.left}} left · {{g.freq}}</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span class="mono" style="font-size: 22px; font-weight: 300; line-height: 1; color: #E6ECEE">{{g.pct}}<span style="font-size: 11px; color: #7F8A91">%</span></span>
<span class="mono" style="font-size: 10px; color: #8B969D">expected {{g.exp}}%</span>
</div>
<span class="mono" style="font-size: 10px; color: {{g.stc}}">● {{g.st}}</span>
</div>
<div style="position: relative; height: 3px; background: #1A1F22; border-radius: 2px">
<div class="grow" style="width: {{g.pct}}%; height: 100%; background: {{g.c}}; border-radius: 2px"></div>
<div title="expected today" style="position: absolute; top: -3px; left: {{g.exp}}%; width: 1px; height: 9px; background: #D5DBDE"></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 18px; padding-top: 2px">
<sc-if value="{{g.isHabit}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{g.wkAria}}" style="display: flex; align-items: center; gap: 4px">
<sc-for list="{{g.week}}" as="w" hint-placeholder-count="7"><span style="width: 9px; height: 9px; box-sizing: border-box; border-radius: 2px; background: {{w.bg}}; border: 1px solid {{w.border}}"></span></sc-for>
<span class="mono" style="margin-left: 6px; font-size: 10px; color: #8B969D">{{g.wkTxt}}</span>
</div>
</sc-if>
<sc-if value="{{g.isProject}}" hint-placeholder-val="{{ false }}">
<span class="mono" style="font-size: 10px; color: #8B969D">{{g.metaTxt}}</span>
</sc-if>
<sc-if value="{{g.hasLink}}" hint-placeholder-val="{{ false }}">
<a href="goal.html" class="mono" style="font-size: 10.5px">open board →</a>
</sc-if>
</div>
</article>
</sc-for>
</div>
<sc-if value="{{noGoals}}" hint-placeholder-val="{{ false }}">
<div class="mono" style="padding: 24px; border: 1px dashed #2A3135; border-radius: 6px; text-align: center; font-size: 11px; color: #8B969D">no goals match this filter</div>
</sc-if>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">

<section aria-labelledby="h-points" style="flex: 1.4 1 420px; min-width: 0; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #1A1F22">
<h2 id="h-points" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Points · 30 days</h2>
<div class="mono" style="display: flex; gap: 10px; font-size: 9.5px; color: #8B969D">
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 7px; height: 7px; background: {{accent}}; border-radius: 1px"></span>≥ target</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 7px; height: 7px; background: #2B6E50; border-radius: 1px"></span>≥ 70%</span>
<span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 7px; height: 7px; background: #3A4248; border-radius: 1px"></span>below</span>
</div>
</div>
<div role="img" aria-label="{{chartAria}}" style="position: relative; height: 84px; display: flex; align-items: flex-end; gap: 3px">
<div style="position: absolute; left: 0; right: 0; bottom: 59px; border-top: 1px dashed #3A4348"></div>
<span class="mono" style="position: absolute; right: 0; bottom: 62px; font-size: 9.5px; color: #8B969D; background: #0F1214; padding-left: 4px">target 14</span>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><div class="bar" title="{{b.label}}" style="flex: 1 1 0; min-width: 0; height: {{b.h}}px; background: {{b.bg}}; border-radius: 1px"></div></sc-for>
</div>
<div class="mono" style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 9.5px; color: #7F8A91"><span>24 sep</span><span>08 oct</span><span style="color: {{accent}}">today</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #1A1F22">
<div><div class="mono" style="font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B969D">average</div><div class="mono" style="font-size: 16px; color: #E6ECEE">{{avgPts}}</div></div>
<div><div class="mono" style="font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B969D">best day</div><div class="mono" style="font-size: 16px; color: #E6ECEE">{{bestPts}}</div></div>
<div><div class="mono" style="font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B969D">days ≥ target</div><div class="mono" style="font-size: 16px; color: #E6ECEE">{{daysMet}}<span style="font-size: 11px; color: #7F8A91">/30</span></div></div>
</div>
</section>

<section aria-labelledby="h-consistency" style="flex: 1 1 300px; min-width: 0; background: #0F1214; border: 1px solid #1F2529; border-radius: 6px; padding: 12px 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #1A1F22">
<h2 id="h-consistency" class="mono" style="margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #B7C0C4">Consistency · 12 weeks</h2>
<span class="mono" style="font-size: 10px; color: #8B969D">{{goodDays}} good days</span>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<div class="mono" aria-hidden="true" style="display: flex; flex-direction: column; gap: 3px; font-size: 9px; color: #7F8A91">
<span style="height: 13px; line-height: 13px">mon</span><span style="height: 13px; line-height: 13px"> </span><span style="height: 13px; line-height: 13px">wed</span><span style="height: 13px; line-height: 13px"> </span><span style="height: 13px; line-height: 13px">fri</span><span style="height: 13px; line-height: 13px"> </span><span style="height: 13px; line-height: 13px">sun</span>
</div>
<div role="img" aria-label="{{heatAria}}" style="display: flex; gap: 3px">
<sc-for list="{{heat}}" as="wk" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{wk.days}}" as="d" hint-placeholder-count="7"><span title="{{d.label}}" style="width: 13px; height: 13px; box-sizing: border-box; border-radius: 2px; background: {{d.bg}}; border: 1px solid {{d.border}}"></span></sc-for>
</div>
</sc-for>
</div>
</div>
<div class="mono" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 12px; font-size: 9.5px; color: #8B969D">
<span>{{goodPct}}% of days with ≥ 10 pts</span>

function get(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope) {
  return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = get(p, scope); return v == null ? '' : String(v); });
}
function proc(node, scope) {
  if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
  if (node.nodeType !== 1) return [];
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = get(node.getAttribute('list').replace(/[{}]/g, ''), scope) || [];
    const as = node.getAttribute('as');
    const out = [];
    list.forEach((item, i) => {
      const s = Object.assign({}, scope, { [as]: item, $index: i });
      node.childNodes.forEach((c) => out.push(...proc(c, s)));
    });
    return out;
  }
  if (tag === 'sc-if') {
    if (!get(node.getAttribute('value').replace(/[{}]/g, ''), scope)) return [];
    const out = [];
    node.childNodes.forEach((c) => out.push(...proc(c, scope)));
    return out;
  }
  const svg = node.namespaceURI === 'http://www.w3.org/2000/svg';
  const el = svg ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
  for (const a of node.attributes) {
    if (a.name.startsWith('hint-')) continue;
    if (/^on[a-z]+$/.test(a.name)) {
      const fn = get(a.value.replace(/[{}]/g, ''), scope);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    el.setAttribute(a.name, interp(a.value, scope));
  }
  if ([...node.childNodes].some((c) => c.nodeType === 3 && /\{\{\s*clock\s*\}\}/.test(c.nodeValue))) el.dataset.live = 'clock';
  node.childNodes.forEach((c) => proc(c, scope).forEach((n) => el.appendChild(n)));
  return [el];
}

    if (keys.length === 1 && keys[0] === 'tick') return this.__tick();
    this.__render();
  }
  forceUpdate() { this.__render(); }
}

      const hits = wk.filter((v) => v).length;
      const week = wk.map((v, i) => {
        const future = i > TODAY_IDX;
        return { id: g.id + i, bg: v ? g.c : (future ? 'transparent' : '#1B2023'), border: v ? g.c : (future ? '#2A3135' : '#1B2023') };
      });
      return {
        id: g.id, t: g.t, type: g.type, pri: g.pri, c: g.c, start: g.start, end: g.end, left: g.left, freq: g.freq,
        pct: g.pct, exp: g.exp, diff, st, stc,
        priColor: PRI[g.pri].c, priBorder: PRI[g.pri].b,
        isHabit, isProject: !isHabit, hasLink: !!g.href,
        metaTxt: g.metaTxt || '',
        week, wkTxt: hits + '/' + g.wkGoal + ' this week',
        wkAria: hits + ' of ' + g.wkGoal + ' days done this week'
      };
    });
    const onPace = allGoals.filter((g) => g.diff >= 0).length;
    const behind = allGoals.length - onPace;
    const FILTERS = [
      { id: 'all', label: 'all', test: () => true },
      { id: 'habit', label: 'habit', test: (g) => g.isHabit },
      { id: 'project', label: 'project', test: (g) => g.isProject },
      { id: 'off', label: 'off pace', test: (g) => g.diff < 0 }
    ];
    const active = FILTERS.find((f) => f.id === filter) || FILTERS[0];
    const goals = allGoals.filter(active.test);
    const tabs = FILTERS.map((f) => {
      const on = f.id === active.id;
      return {
        id: f.id, label: f.label, count: String(allGoals.filter(f.test).length),
        pressed: on ? 'true' : 'false',
        border: on ? '#3A4348' : '#1F2529',
        bg: on ? '#161B1E' : 'transparent',
        color: on ? '#E6ECEE' : '#8B969D',
        pick: () => this.setState({ filter: f.id })
      };
    });

    const SERIES = [12, 15, 9, 14, 16, 11, 4, 13, 15, 17, 14, 8, 12, 16, 18, 15, 13, 6, 14, 15, 17, 16, 12, 15, 14, 18, 16, 13, 15];
    const series = SERIES.concat([pts]);
    const bars = series.map((v, i) => ({
      id: 'b' + i,
      h: Math.max(2, Math.round(v / 20 * 84)),
      bg: v >= GOAL ? accent : (v >= 10 ? '#2B6E50' : '#3A4248'),
      label: (i === series.length - 1 ? 'today · ' : '') + v + ' pts'
    }));
    const sum = series.reduce((a, b) => a + b, 0);
    const avgPts = (sum / series.length).toFixed(1);
    const bestPts = String(Math.max.apply(null, series));
    const daysMet = String(series.filter((v) => v >= GOAL).length);

    const LV = ['#161B1E', '#173A2C', '#1F6145', '#2F9163', accent];
    const LABELS = ['no entries', 'weak', 'ok', 'good', 'target hit'];
    const heat = [];
    let good = 0;
    let total = 0;
    for (let w = 0; w < 12; w++) {
      const days = [];
      for (let dd = 0; dd < 7; dd++) {
        const future = w === 11 && dd > TODAY_IDX;
        let lv;
        if (w === 11 && dd === TODAY_IDX) lv = pts >= GOAL ? 4 : (pts >= 10 ? 3 : (pts > 0 ? 2 : 0));
        else {
          lv = ((w * 7 + dd) * 37 + w * 3) % 9;
          lv = lv > 4 ? lv - 4 : lv;
          if (dd >= 5) lv = Math.max(0, lv - 1);
        }
        if (!future) { total++; if (lv >= 3) good++; }
        days.push({ id: 'h' + w + '_' + dd, bg: future ? 'transparent' : LV[lv], border: future ? '#22282C' : LV[lv], label: future ? 'future' : LABELS[lv] });
      }
      heat.push({ id: 'w' + w, days });
    }

    const REM = [
      { id: 'r1', time: '07:30', freq: 'daily', label: 'Daily brief', ch: 'telegram' },
      { id: 'r2', time: '21:30', freq: 'daily', label: 'Evening check-in', ch: 'telegram' },
      { id: 'r3', time: '18:00', freq: 'day before', label: 'Tasks due tomorrow', ch: 'telegram' },
      { id: 'r4', time: '10:00', freq: 'sunday', label: 'Weekly review', ch: 'telegram · email' },
      { id: 'r5', time: '09:00', freq: 'monday', label: 'Goals off pace', ch: 'email' }
    ];
    const reminders = REM.map((r) => {
      const on = !!rem[r.id];
      return {
        id: r.id, time: r.time, freq: r.freq, label: r.label, ch: r.ch,
        pressed: on ? 'true' : 'false',
        aria: (on ? 'Pause' : 'Enable') + ' reminder: ' + r.label,
        timeColor: on ? '#E6ECEE' : '#7F8A91',
        labelColor: on ? '#D5DBDE' : '#8B969D',
        trackBorder: on ? accent : '#3A4348',
        trackBg: on ? 'rgba(74, 222, 154, 0.12)' : 'transparent',
        knobBg: on ? accent : '#7F8A91',
        knobX: on ? 12 : 0,
        toggle: () => this.toggleRem(r, on)
      };
    });
    const remOn = String(REM.filter((r) => rem[r.id]).length);

    const KIND = { ok: accent, undo: '#FF6B6B', info: '#6CB4FF', warn: '#F2B03D' };
    const log = logRaw.map((l) => ({ id: l.id, t: l.t, sym: l.sym, txt: l.txt, pts: l.pts, symColor: KIND[l.kind] || '#8B969D', ptsColor: l.kind === 'ok' ? accent : (l.kind === 'undo' ? '#FF6B6B' : '#8B969D') }));

    const weekPts = 47 + pts;
    const wDiff = Math.round((weekPts - 52) / 52 * 100);
    const overdueCount = overdueAll.length;
    const kpis = [
      { id: 'k-pts', label: 'points today', value: String(pts), suffix: '/' + GOAL, valueColor: pts >= GOAL ? accent : '#E6ECEE', sub: pts >= GOAL ? 'daily target hit' : todayPct + '% of daily target', subColor: pts >= GOAL ? accent : '#8B969D', barOpacity: 1, barPct: todayPct, barColor: accent },
      { id: 'k-seq', label: 'streak', value: String(pts >= GOAL ? 13 : 12), suffix: ' days', valueColor: '#E6ECEE', sub: 'record · 21 days', subColor: '#8B969D', barOpacity: 1, barPct: Math.round((pts >= GOAL ? 13 : 12) / 21 * 100), barColor: '#3A4348' },
      { id: 'k-sem', label: 'this week', value: String(weekPts), suffix: ' pts', valueColor: '#E6ECEE', sub: (wDiff >= 0 ? '+' : '') + wDiff + '% vs last week', subColor: wDiff >= 0 ? accent : '#FF6B6B', barOpacity: 0, barPct: 0, barColor: accent },
      { id: 'k-rit', label: 'goals on pace', value: String(onPace), suffix: '/' + allGoals.length, valueColor: '#E6ECEE', sub: behind + ' off pace', subColor: behind ? '#F2B03D' : accent, barOpacity: 1, barPct: Math.round(onPace / allGoals.length * 100), barColor: '#6CB4FF' },
      { id: 'k-atr', label: 'overdue', value: String(overdueCount), suffix: '', valueColor: overdueCount ? '#FF6B6B' : '#E6ECEE', sub: lateK + ' from nomad visa', subColor: '#8B969D', barOpacity: 0, barPct: 0, barColor: '#FF6B6B' },
      { id: 'k-prz', label: 'on time · 30d', value: '86', suffix: '%', valueColor: '#E6ECEE', sub: '31 of 36 delivered', subColor: '#8B969D', barOpacity: 1, barPct: 86, barColor: '#8B969D' }
    ];

    const ptsLeft = Math.max(0, GOAL - pts);
    const footerRight = ptsLeft ? 'next reminder 21:30 · ' + ptsLeft + ' pts to daily target' : 'daily target hit · next reminder 21:30';

    return {
      accent,
      scanClass: scan ? 'scan' : '',
      dateTxt, clock, yearPct,
      kpis,
      actions, pts, todayPct, doneCount, actionCount: ACTIONS.length,
      overdue: overdueAll, overdueCount, lateK, showTip: lateK > 0,
      upcoming, upcomingCount: upcoming.length,
      goals, goalCount: allGoals.length, onPace, tabs, noGoals: goals.length === 0,
      bars, avgPts, bestPts, daysMet,
      chartAria: 'Points per day over the last 30 days. Average ' + avgPts + ', best day ' + bestPts + ', ' + daysMet + ' days hit the target of 14.',
      heat, goodDays: good + '/' + total, goodPct: Math.round(good / total * 100),
      heatAria: good + ' of ' + total + ' days with at least 10 points over the last 12 weeks',
      reminders, remOn,
      columns, vistoDone, vistoPct,
      log,
      footerRight
    };
  }
}


const app = new Component();
const tpl = document.getElementById('tpl').content;
const root = document.getElementById('root');
app.__render = () => {
  const vals = app.renderVals();
  const kept = {};
  root.querySelectorAll('input[name]').forEach((el) => { kept[el.name] = el.value; });
  const focused = document.activeElement && document.activeElement.id;
  const nodes = [];
  tpl.childNodes.forEach((n) => nodes.push(...proc(n, vals)));
  root.replaceChildren(...nodes);
  root.querySelectorAll('input[name]').forEach((el) => { if (el.name in kept) el.value = kept[el.name]; });
  if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
};
app.__tick = () => {
  const vals = app.renderVals();
  root.querySelectorAll('[data-live="clock"]').forEach((el) => {
    el.textContent = vals.clock;
  });
};
app.__render();
requestAnimationFrame(() => setTimeout(() => root.classList.add('settled'), 600));
if (app.componentDidMount) app.componentDidMount();

</script>
