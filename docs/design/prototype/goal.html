<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0C0D}
a{color:#9FE7C4;text-decoration:none}a:hover{color:#C8F5DF}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:1px solid #4ADE9A;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{transition:background .15s}
.row:hover{background:#13181B}
.card{transition:border-color .2s}
.card:hover{border-color:#2E373C}
.chk{transition:border-color .15s,color .15s}
.chk:hover{border-color:#8B969D;color:#E6ECEE}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.grow{transition:width .45s ease}
.scan{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
</style>
<style>.settled .fade{animation:none}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>

<script>

function get(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope) {
  return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = get(p, scope); return v == null ? '' : String(v); });
}
function proc(node, scope) {
  if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
  if (node.nodeType !== 1) return [];
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = get(node.getAttribute('list').replace(/[{}]/g, ''), scope) || [];
    const as = node.getAttribute('as');
    const out = [];
    list.forEach((item, i) => {
      const s = Object.assign({}, scope, { [as]: item, $index: i });
      node.childNodes.forEach((c) => out.push(...proc(c, s)));
    });
    return out;
  }
  if (tag === 'sc-if') {
    if (!get(node.getAttribute('value').replace(/[{}]/g, ''), scope)) return [];
    const out = [];
    node.childNodes.forEach((c) => out.push(...proc(c, scope)));
    return out;
  }
  const svg = node.namespaceURI === 'http://www.w3.org/2000/svg';
  const el = svg ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
  for (const a of node.attributes) {
    if (a.name.startsWith('hint-')) continue;
    if (/^on[a-z]+$/.test(a.name)) {
      const fn = get(a.value.replace(/[{}]/g, ''), scope);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    el.setAttribute(a.name, interp(a.value, scope));
  }
  if ([...node.childNodes].some((c) => c.nodeType === 3 && /\{\{\s*clock\s*\}\}/.test(c.nodeValue))) el.dataset.live = 'clock';
  node.childNodes.forEach((c) => proc(c, scope).forEach((n) => el.appendChild(n)));
  return [el];
}
class DCLogic {
  constructor() { this.props = {}; this.state = null; }
  setState(patch) {
    this.state = Object.assign({}, this.state || {}, patch);
    const keys = Object.keys(patch);
    if (keys.length === 1 && keys[0] === 'tick') return this.__tick();
    this.__render();
  }
  forceUpdate() { this.__render(); }
}


class Component extends DCLogic {
  tasks() {
    return [
      { id: 't1', t: 'Health insurance, no co-pay', due: '24 oct', sub: [0, 3], tag: 'critical' },
      { id: 't2', t: 'Bank statements · 3 months', due: '22 oct', sub: [1, 3], late: true },
      { id: 't3', t: 'Apostille diploma', due: '20 oct', sub: [0, 2], late: true },
      { id: 't4', t: 'Apostilled criminal record', due: '05 nov', sub: [0, 2] },
      { id: 't5', t: 'Application form filled in', due: '10 nov', sub: [0, 1] },
      { id: 't6', t: 'Proof of income · 3 months', due: '12 nov', sub: [1, 3] },
      { id: 't7', t: 'Pay application fee', due: '15 nov', sub: [0, 1] },
      { id: 't8', t: 'Book filing appointment', due: '20 nov', sub: [0, 1], tag: 'milestone' },
      { id: 't9', t: 'Photos in required format', due: '25 nov', sub: [0, 1] },
      { id: 't10', t: 'Sworn translation', due: '28 oct', sub: [2, 5] },
      { id: 't11', t: 'Apostilled marriage certificate', due: '30 oct', sub: [1, 2] },
      { id: 't12', t: 'Passport · certified copy', due: '05 oct', sub: [2, 2] },
      { id: 't13', t: 'Remote work contract', due: '10 oct', sub: [3, 3] },
      { id: 't14', t: 'Employer letter', due: '12 oct', sub: [1, 1] },
      { id: 't15', t: 'Proof of 3+ months employment', due: '14 oct', sub: [1, 1] },
      { id: 't16', t: 'Scanned diploma', due: '20 sep', sub: [1, 1] },
      { id: 't17', t: 'Updated CV', due: '15 sep', sub: [1, 1] },
      { id: 't18', t: 'Official document checklist', due: '01 sep', sub: [1, 1] },
      { id: 't19', t: 'Research requirements and deadlines', due: '20 aug', sub: [1, 1] },
      { id: 't20', t: 'Process cost spreadsheet', due: '10 aug', sub: [1, 1] }
    ];
  }
  defSt() {
    const st = {};
    for (let i = 1; i <= 9; i++) st['t' + i] = 'todo';
    st.t10 = 'doing';
    st.t11 = 'doing';
    for (let i = 12; i <= 20; i++) st['t' + i] = 'done';
    return st;
  }
  defLog() {
    return [
      { id: 'l1', t: '22 oct', sym: '!', kind: 'warn', txt: 'bank statements overdue' },
      { id: 'l2', t: '20 oct', sym: '!', kind: 'warn', txt: 'apostille diploma overdue' },
      { id: 'l3', t: '14 oct', sym: '✓', kind: 'ok', txt: 'proof of employment completed' },
      { id: 'l4', t: '12 oct', sym: '✓', kind: 'ok', txt: 'employer letter completed' },
      { id: 'l5', t: '10 oct', sym: '→', kind: 'info', txt: 'sworn translation → doing' },
      { id: 'l6', t: '10 oct', sym: '✓', kind: 'ok', txt: 'remote work contract completed' }
    ];
  }
  move(task, to, label) {
    const s = this.state || {};
    const st = Object.assign({}, s.st || this.defSt());
    st[task.id] = to;
    const d = new Date();
    const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const entry = { id: 'l' + Date.now(), t: 'today ' + t, sym: to === 'done' ? '✓' : (to === 'todo' ? '↺' : '→'), kind: to === 'done' ? 'ok' : 'info', txt: task.t.toLowerCase() + ' → ' + label };
    this.setState({ st, log: [entry].concat(s.log || this.defLog()).slice(0, 8) });
  }
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#4ADE9A';
    const scan = this.props.scanlines ?? true;
    const st = s.st || this.defSt();
    const TASKS = this.tasks();
    const counts = { todo: 0, doing: 0, done: 0 };
    TASKS.forEach((t) => { counts[st[t.id]]++; });
    const doneCount = counts.done;
    const pct = Math.round(doneCount / 20 * 100);
    const EXP = 58;
    const diff = pct - EXP;
    const stTxt = diff <= -5 ? 'behind ' + diff + '%' : (diff < 0 ? 'watch ' + diff + '%' : (diff >= 5 ? 'ahead +' + diff + '%' : 'on pace'));
    const stColor = diff <= -5 ? '#FF6B6B' : (diff < 0 ? '#F2B03D' : accent);

    const TOTAL = 198;
    const ELAPSED = 114;
    const x = (day) => 40 + day / TOTAL * 510;
    const yv = (p) => 12 + (1 - p / 100) * 118;
    const pts = [[0, 0], [28, 10], [56, 20], [84, 35], [ELAPSED, pct]];
    const realPts = pts.map((p) => x(p[0]).toFixed(1) + ',' + yv(p[1]).toFixed(1)).join(' ');
    const rate = pct / ELAPSED;
    const projPct = Math.min(100, Math.round(pct + rate * (TOTAL - ELAPSED)));
    const left = 20 - doneCount;
    const needWk = (left / 12).toFixed(1);
    const curWk = (doneCount / (ELAPSED / 7)).toFixed(1);

    const COLS = [
      { id: 'todo', label: 'to do', dot: '#8B969D', next: 'doing', nextLabel: 'doing', btn: '→' },
      { id: 'doing', label: 'doing', dot: '#F2B03D', next: 'done', nextLabel: 'done', btn: '→' },
      { id: 'done', label: 'done', dot: accent, next: 'todo', nextLabel: 'to do', btn: '↺' }
    ];
    const columns = COLS.map((col) => {
      const isDone = col.id === 'done';
      const cards = TASKS.filter((t) => st[t.id] === col.id).map((t) => {
        const late = !!t.late && !isDone;
        const subDone = isDone ? t.sub[1] : t.sub[0];
        return {
          id: t.id, t: t.t,
          sub: subDone + '/' + t.sub[1],
          subPct: Math.round(subDone / t.sub[1] * 100),
          subColor: isDone ? '#3A4348' : (late ? '#FF6B6B' : '#F2B03D'),
          dueTxt: isDone ? 'completed' : (late ? 'overdue ' + t.due : 'due ' + t.due),
          dueColor: late ? '#FF6B6B' : '#8B969D',
          border: late ? '#4A2626' : '#1F2529',
          tc: isDone ? '#7F8A91' : '#D5DBDE',
          deco: isDone ? 'line-through' : 'none',
          hasTag: !!t.tag && !isDone, tag: t.tag || '',
          btn: col.btn,
          moveLabel: (isDone ? 'Reopen "' : 'Move "') + t.t + '" to ' + col.nextLabel,
          move: () => this.move(t, col.next, col.nextLabel)
        };
      });
      return { id: col.id, label: col.label, dot: col.dot, count: String(cards.length), cards };
    });

    const lateOpen = TASKS.filter((t) => t.late && st[t.id] !== 'done').length;
    const fields = [
      { id: 'f1', k: 'start', v: '01 jul 2026' },
      { id: 'f2', k: 'due date', v: '15 jan 2027' },
      { id: 'f3', k: 'remaining', v: '84 days' },
      { id: 'f4', k: 'type', v: 'project' },
      { id: 'f5', k: 'priority', v: 'high' },
      { id: 'f6', k: 'frequency', v: '—' },
      { id: 'f7', k: 'color', v: '#F2B03D', swatch: true },
      { id: 'f8', k: 'overdue', v: String(lateOpen) }
    ];
    const stats = [
      { id: 's1', k: 'expected today', v: String(EXP), unit: '%', color: '#E6ECEE' },
      { id: 's2', k: 'projected at due', v: String(projPct), unit: '%', color: projPct >= 100 ? accent : '#FF6B6B' },
      { id: 's3', k: 'current pace', v: curWk, unit: ' tasks/wk', color: '#E6ECEE' },
      { id: 's4', k: 'required pace', v: needWk, unit: ' tasks/wk', color: '#F2B03D' }
    ];
    const split = [
      { id: 'p1', label: 'to do', n: counts.todo, w: counts.todo / 20 * 100, c: '#3A4348' },
      { id: 'p2', label: 'doing', n: counts.doing, w: counts.doing / 20 * 100, c: '#F2B03D' },
      { id: 'p3', label: 'done', n: counts.done, w: counts.done / 20 * 100, c: accent }
    ];
    const reminders = [
      { id: 'r1', when: 'day before', label: 'Task due tomorrow alert', freq: '18:00' },
      { id: 'r2', when: 'monday', label: 'Pace summary for this goal', freq: '09:00' },
      { id: 'r3', when: '01 jan', label: 'Alert: 14 days to deadline', freq: 'once' }
    ];
    const KIND = { ok: accent, info: '#6CB4FF', warn: '#F2B03D' };
    const log = (s.log || this.defLog()).map((l) => ({ id: l.id, t: l.t, sym: l.sym, txt: l.txt, symColor: KIND[l.kind] || '#8B969D' }));

    return {
      accent,
      scanClass: scan ? 'scan' : '',
      stTxt, stColor,
      fields, stats, split,
      pct, doneCount,
      todayX: x(ELAPSED).toFixed(1),
      realY: yv(pct).toFixed(1),
      expY: yv(EXP).toFixed(1),
      projY: yv(projPct).toFixed(1),
      projLabelY: (yv(projPct) - 5).toFixed(1),
      realPts, projPct,
      chartAria: 'Actual progress ' + pct + '% against ' + EXP + '% expected today. At the current pace the goal reaches ' + projPct + '% by the due date.',
      columns, reminders, log
    };
  }
}


const app = new Component();
const tpl = document.getElementById('tpl').content;
const root = document.getElementById('root');
app.__render = () => {
  const vals = app.renderVals();
  const kept = {};
  root.querySelectorAll('input[name]').forEach((el) => { kept[el.name] = el.value; });
  const focused = document.activeElement && document.activeElement.id;
  const nodes = [];
  tpl.childNodes.forEach((n) => nodes.push(...proc(n, vals)));
  root.replaceChildren(...nodes);
  root.querySelectorAll('input[name]').forEach((el) => { if (el.name in kept) el.value = kept[el.name]; });
  if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
};
app.__tick = () => {
  const vals = app.renderVals();
  root.querySelectorAll('[data-live="clock"]').forEach((el) => {
    el.textContent = vals.clock;
  });
};
app.__render();
requestAnimationFrame(() => setTimeout(() => root.classList.add('settled'), 600));
if (app.componentDidMount) app.componentDidMount();

</script>
